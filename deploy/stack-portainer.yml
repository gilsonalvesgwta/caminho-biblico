# Stack para a VPS Wtatechor3 (Docker Swarm + Traefik + Portainer)
# A imagem é montada e testada pelo GitHub Actions a cada envio para o main (amd64 + arm64)
# e publicada em ghcr.io/gilsonalvesgwta/caminho-biblico:main.
# Atualizar: Portainer > Stacks > caminho > Update the stack, com "Re-pull image and redeploy" ligado.
# Fixar/voltar uma versão: trocar :main pela versão AAAA.MM.DD-xxxxxxx do resumo do CI.

version: "3.8"

services:
  app:
    image: ghcr.io/gilsonalvesgwta/caminho-biblico:main
    environment:
      - NODE_ENV=production
      - APP_URL=https://caminho.wtatech.com.br
      - PORT=3100
      - DATA_DIR=/app/data
      - TRUST_PROXY=true
      - COOKIE_SECURE=true
      - TZ=America/Sao_Paulo
      # Primeiro administrador (só é criado se ainda não existir nenhum)
      - ADMIN_EMAIL=TROQUE@seuemail.com
      - ADMIN_PASSWORD=TROQUE-POR-UMA-SENHA-FORTE
      - ADMIN_NAME=Gilson
    volumes:
      - caminho_data:/app/data
    networks:
      - Wtatechor3Net
    deploy:
      replicas: 1            # SQLite: manter 1 réplica
      update_config:
        order: stop-first    # nunca duas instâncias no mesmo banco
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.docker.network=Wtatechor3Net
        - traefik.http.routers.caminho.rule=Host(`caminho.wtatech.com.br`)
        - traefik.http.routers.caminho.entrypoints=websecure
        - traefik.http.routers.caminho.tls=true
        - traefik.http.routers.caminho.tls.certresolver=letsencryptresolver
        - traefik.http.routers.caminho.priority=10
        - traefik.http.services.caminho.loadbalancer.server.port=3100

volumes:
  caminho_data:
    external: false

networks:
  Wtatechor3Net:
    external: true
