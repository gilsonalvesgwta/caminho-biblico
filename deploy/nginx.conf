# /etc/nginx/sites-available/caminho-biblico  →  ln -s ../sites-available/caminho-biblico /etc/nginx/sites-enabled/
# Depois: sudo certbot --nginx -d app.seudominio.com.br
server {
    listen 80;
    server_name app.seudominio.com.br;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
