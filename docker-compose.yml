services:
  caminho-biblico:
    build: .
    container_name: caminho-biblico-app
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/app/data
    ports:
      - "127.0.0.1:3100:3100"   # só o Nginx da VPS acessa
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
